name: Release integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check public candidate and CPU tests
        run: |
          python3 --version
          python3 -m venv /tmp/tempo-ci
          /tmp/tempo-ci/bin/pip install pytest==8.3.5 numpy==2.2.6
          /tmp/tempo-ci/bin/python tools/release_check.py
          /tmp/tempo-ci/bin/python -m pytest -q
